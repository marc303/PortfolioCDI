<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/form.css" />
    <script src="../javascript/script.js"></script>
    <title>Astrologie Orion</title>
  </head>
  <body onload="modifiedLast()">
    <header>
      <div class="logo">
        <img src="../img/logo-no-background.png" alt="Logo Astrologie Orion" />
      </div>
    </header>
    <div class="navbar">
      <ul>
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="chara.html">Charactéristiques des signes</a></li>
        <li><a href="traits.html">Traits des signes</a></li>
        <li><a class="active">Horoscope du jour</a></li>
        <li><a href="mailto:proprietaire@info_orion.ca">Contactez-nous</a></li>
        <li>
          <form>
            <input type="text" placeholder="Recherche.." name="search" />
            <button type="submit"><i class="fa fa-search"></i></button>
          </form>
        </li>
      </ul>
    </div>
    <section>
      <main>
        <h2>Horoscope du jour</h2>
        <div id="formulaire">
          <form action="">
            <label for="nom">Nom:</label>
            <input type="text" placeholder="Saissisez votre nom" />
            <br />
            <label for="prenom">Prénom:</label>
            <input type="text" placeholder="Saissisez votre prénom" />
            <br />
            <label for="birthdate">Date de naissance:</label>
            <input type="date" name="birthdate" id="birthdate" />
            <br />
            <label for="signe">Choissisez un signe:</label>
            <select name="signe" id="signe">
              <option value="belier">Bélier</option>
              <option value="taureau">Taureau</option>
              <option value="gemeaux">Gémeaux</option>
              <option value="cancer">Cancer</option>
              <option value="lion">Lion</option>
              <option value="vierge">Vierge</option>
              <option value="balance">Balance</option>
              <option value="scorpion">Scorpion</option>
              <option value="sagittaire">Sagittaire</option>
              <option value="capricorne">Capricorne</option>
              <option value="verseau">Verseau</option>
              <option value="poisson">Poissons</option>
            </select>
            <br />
            <input type="submit" value="Soumettre" id="submit" />
          </form>
        </div>
      </main>
    </section>
    <footer>
      <p>Ce document a été modifié en dernier le: <span id="date"></span></p>
      <p id="copyright">&copy; 2022 Astrologie Orion</p>
    </footer>
  </body>
</html>
